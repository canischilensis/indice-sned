[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indice-sned"
version = "0.5.0"
description = "Ecosistema predictivo B2B con IA Explicable para la anticipacion del Indice SNED"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["quanta"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "quanta/q4_cliente"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
extend-exclude = "notebooks|quanta/q4_cliente"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["quanta"]
addopts = "-q --strict-markers"
markers = [
  "datos: pruebas sobre el pipeline de datos (QA-A)",
  "modelo: pruebas estadisticas sobre el motor predictivo (QA-B)",
  "api: pruebas sobre el servicio y RBAC (QA-C)",
  "paridad: paridad entre los adaptadores del puerto RepositorioEstablecimientos (QA-D)",
  "requiere_datos: necesita data/ o models/registry, que no se versionan",
  "requiere_bd: necesita PostgreSQL levantado",
  "agente: pruebas del cuanto 5, el agente asesor (QA-E)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = [
  "quanta/q1_ingesta",
  "quanta/q2_modelamiento",
  "quanta/q3_servicio",
  "quanta/q5_agente",
]
